name: Deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - name: Deploy adapter stack to ENS stack server
        uses: appleboy/ssh-action@v1
        with:
          host: ${{ vars.DEPLOY_HOST }}
          username: ${{ vars.DEPLOY_USER }}
          key: ${{ secrets.DEPLOY_SSH_KEY }}
          command_timeout: 30m
          script_stop: true
          script: |
            set -e
            export PATH="/usr/local/bin:/usr/bin:$PATH"

            echo "========== DEPLOY START =========="
            cd /srv/adapter

            # Every indexer instance the box has enabled. Ports: sepolia 8788, mainnet 8789, base 8790, robinhood 8791.
            SERVICES=""
            for NET in sepolia robinhood base mainnet; do
              if sudo systemctl is-enabled "adapter-indexer@$NET" >/dev/null 2>&1; then
                SERVICES="$SERVICES adapter-indexer@$NET"
              fi
            done

            echo "--- Git pull ---"
            echo "  before: $(git rev-parse --short HEAD)"
            git fetch origin main
            git reset --hard origin/main
            echo "  after:  $(git rev-parse --short HEAD)"
            git rev-parse --short HEAD > REVISION

            echo "--- indexer install ---"
            cd indexer
            npm ci --no-audit --no-fund 2>&1 | tail -2

            echo "--- app install + build ---"
            cd ../app
            npm ci --no-audit --no-fund 2>&1 | tail -2
            VITE_SEPOLIA_API=/api npm run build 2>&1 | tail -5

            for SERVICE in $SERVICES; do
              echo "--- Restarting $SERVICE ---"
              sudo systemctl restart "$SERVICE"
            done

            sleep 5
            for SERVICE in $SERVICES; do
              status=$(sudo systemctl is-active "$SERVICE" || true)
              echo "  $SERVICE: $status"
              if [ "$status" != "active" ]; then
                echo "  ERROR: $SERVICE failed to start!"
                sudo journalctl -u "$SERVICE" -n 30 --no-pager
                exit 1
              fi
            done

            echo "--- Health check ---"
            for SERVICE in $SERVICES; do
              case "$SERVICE" in *sepolia) PORT=8788;; *mainnet) PORT=8789;; *base) PORT=8790;; *robinhood) PORT=8791;; esac
              curl -fsS "http://127.0.0.1:$PORT/api/overview"; echo
            done
            echo "========== DEPLOY COMPLETE =========="
